<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>y=a(x-p)² 放物線の左右移動</title>
<style>
:root{--blue:#2563eb;--green:#15803d;--red:#dc2626;--purple:#7c3aed;--ink:#172033;--bg:#eef3f8}
*{box-sizing:border-box}
body{margin:0;padding:6px;background:var(--bg);font-family:Meiryo,"Hiragino Kaku Gothic ProN",sans-serif;text-align:center;color:var(--ink)}
main{max-width:860px;margin:auto;background:#fff;padding:12px;border-radius:18px;box-shadow:0 8px 28px #1720331c}
h1{font-size:clamp(22px,5vw,35px);margin:4px}.problem{font-size:clamp(20px,5vw,29px);font-weight:bold;margin:8px}.formula{color:var(--blue);font-size:1.24em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:770px;margin:10px auto}.choice{position:relative;border:3px solid #cbd5e1;border-radius:13px;background:#fff;padding:7px;cursor:pointer}.choice:hover{border-color:#60a5fa}.choice:focus-visible{outline:4px solid #93c5fd;outline-offset:2px}.choice canvas{display:block;width:100%;height:auto;border:1px solid #94a3b8;border-radius:7px}.choice.correct{border-color:var(--green);background:#ecfdf5}.choice.wrong{border-color:var(--red);background:#fff1f2}.choice.locked{cursor:default}.badge{position:absolute;left:7px;top:7px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#172033;color:#fff;font-weight:bold;z-index:2}
button.action{font-size:18px;color:#fff;background:var(--purple);font-weight:bold;border:0;border-radius:9px;padding:10px 20px;margin:8px;cursor:pointer}.retry{background:var(--green)!important}.hidden{display:none!important}
#feedback{max-width:730px;min-height:105px;margin:10px auto;padding:12px;border-radius:12px;line-height:1.6}.ok{background:#ecfdf5;color:#166534;border:1px solid #86efac}.ng{background:#fff1f2;color:#9f1239;border:1px solid #fda4af}.stats{margin:10px;font-size:17px}.paused{color:var(--purple);font-weight:bold}.result{max-width:690px;margin:14px auto;padding:16px;background:#f0f9ff;border:2px solid #7dd3fc;border-radius:14px;font-size:20px;line-height:1.65}.guide{font-size:14px;color:#64748b}
@media(max-width:540px){main{padding:7px}.choices{gap:6px}.choice{padding:4px;border-width:2px}.badge{width:25px;height:25px;font-size:14px;left:4px;top:4px}.stats,#feedback{font-size:14px}}
</style>
</head>
<body><main>
<h1>y=a(x-p)² 放物線の左右移動</h1>
<div class="problem">次の関数のグラフはどれ？<br><span id="formula" class="formula"></span></div>
<div id="choices" class="choices"></div>
<button id="next" class="action hidden" type="button">次の問題へ</button>
<div id="feedback" aria-live="polite"></div>
<div class="stats">問題 <span id="qn">1</span>/5 ｜ 正解数 <span id="score">0</span> ｜ 正答率 <span id="rate">0.0</span>% ｜ 時間 <span id="time">0.0</span>秒 <span id="paused" class="paused hidden">（停止中）</span></div>
<div class="guide">出題はすべて横移動です。A〜Dのグラフをタップして答えよう。</div>
<div id="result" class="result hidden"></div>
<button id="retry" class="action retry hidden" type="button">もう一度挑戦</button>
</main>
<script>
(()=>{'use strict';
const TOTAL=5,MIN=-6,MAX=6,W=320,H=320,PAD=30,LETTERS=['A','B','C','D'];
let question=1,score=0,locked=false,finished=false,options=[],target=null,pattern=1,lastKey='';
let elapsed=0,since=0,running=false,timer=null;
const choicesEl=document.getElementById('choices'),formulaEl=document.getElementById('formula');
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function formula(o){let s='y = ';s+=o.a===1?'':o.a===-1?'−':(o.a<0?'−'+(-o.a):o.a);if(o.type==='h'){s+='(x'+(o.shift>0?' − ':' + ')+Math.abs(o.shift)+')²'}else{s+='x²'+(o.shift>0?' + ':' − ')+Math.abs(o.shift)}return s}
function vertex(o){return o.type==='h'?{x:o.shift,y:0}:{x:0,y:o.shift}}
function key(o){return[o.type,o.a,o.shift].join(':')}
function drawGraph(canvas,o){const c=canvas.getContext('2d'),plot=W-PAD*2,X=x=>PAD+(x-MIN)/(MAX-MIN)*plot,Y=y=>PAD+(MAX-y)/(MAX-MIN)*plot;c.clearRect(0,0,W,H);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.strokeStyle='#e2e8f0';c.lineWidth=1;for(let i=MIN;i<=MAX;i++){line(c,X(i),PAD,X(i),H-PAD);line(c,PAD,Y(i),W-PAD,Y(i))}c.strokeStyle='#1f2937';c.lineWidth=1.7;line(c,PAD,Y(0),W-PAD,Y(0));line(c,X(0),H-PAD,X(0),PAD);c.fillStyle='#1f2937';c.font='10px sans-serif';c.textAlign='center';for(let i=MIN;i<=MAX;i+=2)if(i)c.fillText(i,X(i),Y(0)+12);c.textAlign='left';for(let i=MIN;i<=MAX;i+=2)if(i)c.fillText(i,X(0)+4,Y(i)+3);c.strokeStyle='#2563eb';c.lineWidth=3;c.beginPath();let started=false;for(let px=0;px<=plot;px++){const x=MIN+px/plot*(MAX-MIN),inside=o.type==='h'?x-o.shift:x,y=o.a*inside*inside+(o.type==='v'?o.shift:0);if(y<MIN-.2||y>MAX+.2){started=false;continue}if(!started){c.moveTo(X(x),Y(y));started=true}else c.lineTo(X(x),Y(y))}c.stroke()}
function now(){return elapsed+(running?performance.now()-since:0)}function render(){document.getElementById('time').textContent=(now()/1000).toFixed(1)}function startClock(){if(!running&&!finished){since=performance.now();running=true;paused.classList.add('hidden')}}function stopClock(){if(running){elapsed+=performance.now()-since;running=false;render();paused.classList.remove('hidden')}}function resetClock(){elapsed=0;since=performance.now();running=true;paused.classList.add('hidden');render()}
function makeQuestion(){let absA=1+Math.floor(Math.random()*3),mag=1+Math.floor(Math.random()*3),a=(Math.random()<.5?1:-1)*absA,shift=(Math.random()<.5?1:-1)*mag,k;do{k=[a,shift].join(':')}while(k===lastKey);lastKey=k;target={type:'h',a,shift};pattern=Math.random()<.5?1:2;if(pattern===1){options=[{type:'h',a,shift},{type:'h',a,shift:-shift},{type:'h',a:-a,shift},{type:'h',a:-a,shift:-shift}]}else{options=[{type:'h',a,shift},{type:'h',a,shift:-shift},{type:'v',a,shift},{type:'v',a,shift:-shift}]}options=shuffle(options);formulaEl.textContent=formula(target);locked=false;feedback.textContent='';feedback.className='';next.classList.add('hidden');choicesEl.innerHTML='';options.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.setAttribute('aria-label','選択肢'+LETTERS[i]);b.innerHTML=`<span class="badge">${LETTERS[i]}</span><canvas width="${W}" height="${H}"></canvas>`;b.onclick=()=>judge(i);choicesEl.appendChild(b);drawGraph(b.querySelector('canvas'),o)})}
function errorMessage(o){const dir=Math.sign(o.a)===Math.sign(target.a),sameKind=o.type==='h',sameHorizontal=sameKind&&o.shift===target.shift,parts=[];if(dir)parts.push('<b>おしい！x²の係数 a は合っています！</b>');if(sameHorizontal)parts.push('<b>おしい！頂点の位置は合っています！</b>');if(!dir)parts.push(`<b>x²の係数 a</b> のプラス・マイナスが逆になっています。<br>a＝${target.a} なので、出題のグラフは${target.a>0?'下に凸です':'上に凸です'}。aの数字が大きいほど細い形になります。`);if(!sameKind){parts.push(`<b>横移動と縦移動が逆になっています。</b><br>出題の式では数が（　）の中にあるので、グラフは左右に動きます。<br>${formula(target)} の頂点は（${target.shift}，0）です。`)}else if(!sameHorizontal){parts.push(`<b>左右の移動方向が逆になっています。</b><br>y＝a(x−p)² の頂点は（p，0）です。<br>${formula(target)} の頂点は（${target.shift}，0）です。`)}return parts.join('<br><br>')}
function judge(i){if(locked||finished)return;locked=true;stopClock();const o=options[i],ok=key(o)===key(target),buttons=[...document.querySelectorAll('.choice')],ci=options.findIndex(x=>key(x)===key(target));buttons.forEach(b=>b.classList.add('locked'));buttons[ci].classList.add('correct');if(!ok)buttons[i].classList.add('wrong');if(ok)score++;document.getElementById('score').textContent=score;rate.textContent=(score/question*100).toFixed(1);feedback.className=ok?'ok':'ng';feedback.innerHTML=ok?`<b>正解！</b><br>a＝${target.a} だから${target.a>0?'下に凸です':'上に凸です'}。<br>頂点は（${target.shift}，0）です。`:`<b>不正解…</b><br>選んだグラフは <b>${formula(o)}</b>、出題のグラフは <b>${formula(target)}</b> です。<br><br>${errorMessage(o)}`;question===TOTAL?finish():next.classList.remove('hidden')}
next.onclick=()=>{question++;qn.textContent=question;startClock();makeQuestion();window.scrollTo({top:0,behavior:'smooth'})};
function finish(){finished=true;clearInterval(timer);paused.classList.add('hidden');const sec=now()/1000;let msg=score===5?'全問正解！左右の移動を完全に見抜いた！':score===4?'おしい！あとひといき！':score>=2?'もっといける！カッコの中と頂点を確認しよう！':score===1?'1つできたら全部できるハズ！':'まずは頂点の位置と放物線の向きを確認しよう！';if(score===5&&sec<20)msg+='<br>はやい，はやすぎる……！君が左右移動スピードマスターだ……。';else if(score===5&&sec<30)msg+='<br>疾風迅雷の左右移動マスター！';result.innerHTML=`<b>結果</b><br>5問中 ${score}問正解<br>正答率 ${(score/5*100).toFixed(1)}%<br>解答時間 ${sec.toFixed(1)}秒<br><br><b>${msg}</b>`;result.classList.remove('hidden');retry.classList.remove('hidden')}
function start(){question=1;score=0;finished=false;lastKey='';qn.textContent='1';document.getElementById('score').textContent='0';rate.textContent='0.0';result.classList.add('hidden');retry.classList.add('hidden');clearInterval(timer);resetClock();timer=setInterval(render,100);makeQuestion();window.scrollTo({top:0})}
retry.onclick=start;start();
})();
</script>
</body></html>
