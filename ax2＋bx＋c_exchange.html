<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ax²＋bx＋cを変形！四択チャレンジ！ Ver.6</title><style>
:root{--b:#2563eb;--g:#15803d;--r:#dc2626;--p:#7c3aed;--ink:#172033;--bg:#eef3f8}*{box-sizing:border-box}body{margin:0;padding:8px;background:var(--bg);font-family:Meiryo,sans-serif;color:var(--ink);text-align:center}main{max-width:820px;margin:auto;background:#fff;padding:14px;border-radius:18px;box-shadow:0 8px 28px #1720331c}h1{font-size:clamp(23px,6vw,38px);margin:4px}.lead{max-width:720px;margin:10px auto 13px;padding:12px;border:3px solid #ec4899;border-radius:12px;background:linear-gradient(135deg,#fff1f2,#fdf2f8);color:#831843;font-size:clamp(18px,4.6vw,24px);font-weight:900;box-shadow:0 3px 8px #83184322}.material-title{font-weight:900;color:#9f1239}.materials{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:720px;margin:9px auto 16px}.material{padding:12px 7px;border:3px solid #d97706;border-radius:11px;background:#fff7d6;color:#111827;font-size:clamp(16px,4vw,20px);line-height:1.55;font-weight:800;text-shadow:0 1px #fff;box-shadow:inset 0 0 0 2px #fff,0 2px 5px #17203322}.material-label{display:block;color:#9a3412;font-weight:900;margin-bottom:3px}.problem{margin:12px auto;padding:13px;border:3px solid #60a5fa;border-radius:13px;background:#eff6ff;max-width:720px}.formula{display:block;margin-top:8px;color:#1d4ed8;font-size:clamp(23px,6vw,34px);font-weight:900}.choices{display:grid;gap:8px;max-width:720px;margin:12px auto}.choice{position:relative;width:100%;padding:12px 12px 12px 48px;text-align:left;border:3px solid #cbd5e1;border-radius:11px;background:#fff;color:#111827;font:700 clamp(18px,4.7vw,24px) Meiryo,sans-serif;cursor:pointer}.choice.correct{border-color:var(--g);background:#ecfdf5}.choice.wrong{border-color:var(--r);background:#fff1f2}.badge{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#172033;color:#fff;font-size:16px}button,.portal{display:inline-block;margin:8px;padding:10px 20px;border:0;border-radius:9px;background:var(--p);color:#fff;font-size:18px;font-weight:900;text-decoration:none}.hint{background:#d97706}.hint-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px auto}.hint-back{background:#64748b}.hint-forward{background:#d97706}.hint-back:disabled,.hint-forward:disabled{opacity:.45;cursor:not-allowed}.retry{background:var(--g)}.portal{background:var(--b)}.hidden{display:none!important}.hint-box{max-width:720px;margin:8px auto;padding:11px;border:2px solid #f59e0b;border-radius:11px;background:#fffbeb;color:#92400e;font-weight:800;line-height:1.55}#feedback{max-width:720px;min-height:100px;margin:10px auto;padding:12px;border-radius:12px;line-height:1.65;text-align:left}.ok{background:#ecfdf5;color:#166534;border:1px solid #86efac}.ng{background:#fff1f2;color:#9f1239;border:1px solid #fda4af}.calc{display:block;margin:7px 0;padding:7px;background:#ffffffa8;border-radius:7px;color:#172033;font-size:18px;text-align:center}.stats{margin:10px}.paused{color:var(--p);font-weight:900}.result{max-width:680px;margin:14px auto;padding:16px;background:#f0f9ff;border:2px solid #7dd3fc;border-radius:14px;font-size:20px;line-height:1.65}@media(max-width:560px){body{padding:4px}main{padding:8px}.materials{gap:5px}.material{padding:8px 4px}.stats,#feedback{font-size:14px}}
</style></head><body><main><h1>ax<sup>2</sup>＋bx＋cを変形！<br>四択チャレンジ！</h1><p class="lead">資料を使って、<b>y＝(x−p)<sup>2</sup>＋q</b> の形にしよう！</p><div id="materials" class="materials"></div><section class="problem"><b>次の関数を y＝(x−p)<sup>2</sup>＋q の形にしよう。</b><span id="questionFormula" class="formula"></span></section><div id="choices" class="choices"></div><div class="hint-controls"><button id="hintBack" class="hint-back" type="button" disabled>← 前のヒント</button><button id="hintForward" class="hint-forward" type="button">ヒントを見る（1/3）</button><button id="next" class="hidden">次の問題へ</button></div><div id="hintBox" class="hint-box hidden"></div><div id="feedback"></div><div class="stats">問題 <span id="qn">1</span>/5 ｜ 正解数 <span id="score">0</span> ｜ 正答率 <span id="rate">0.0</span>% ｜ 時間 <span id="time">0.0</span>秒 <span id="paused" class="paused hidden">（停止中）</span> ｜ 最高記録 <span id="bestRecord">記録なし</span></div><div id="result" class="result hidden"></div><button id="retry" class="retry hidden">もう一度挑戦</button><br><a class="portal" href="https://mathmachine0725.github.io/Math_portal/index.html">← ポータルサイトへ戻る</a></main><script>
(()=>{'use strict';const N=5,L=['A','B','C','D'];let p,q,c,n=1,score=0,locked=false,finished=false,opts=[],last='',hintLevel=0,elapsed=0,since=0,running=false,timer;const by=id=>document.getElementById(id),materials=by('materials'),choices=by('choices'),hintBack=by('hintBack'),hintForward=by('hintForward'),hintBox=by('hintBox'),bestRecord=by('bestRecord'),BEST_KEY='completingSquareQuizBest_v1';function loadBest(){try{const v=JSON.parse(localStorage.getItem(BEST_KEY));return v&&Number.isFinite(v.score)&&Number.isFinite(v.time)?v:null}catch{return null}}function showBest(){const b=loadBest();bestRecord.textContent=b?`${b.score}問正解／${b.time.toFixed(1)}秒`:'記録なし'}function updateBest(s,t){const b=loadBest();if(!b||s>b.score||(s===b.score&&t<b.time)){try{localStorage.setItem(BEST_KEY,JSON.stringify({score:s,time:t}))}catch{}showBest();return true}showBest();return false}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function sg(x){return x>0?' + '+x:x<0?' − '+(-x):''}function lin(k){return k===1?' + x':k===-1?' − x':k>0?' + '+k+'x':' − '+(-k)+'x'}function sq(v){return v>0?'(x − '+v+')²':'(x + '+(-v)+')²'}function ans(a,b){return'y = '+sq(a)+sg(b)}function now(){return elapsed+(running?performance.now()-since:0)}function render(){time.textContent=(now()/1000).toFixed(1)}function startClock(){since=performance.now();running=true;paused.classList.add('hidden')}function stopClock(){if(running){elapsed+=performance.now()-since;running=false;render();paused.classList.remove('hidden')}}function mat(){let ps=[p];while(ps.length<4){let x;do x=Math.floor(Math.random()*11)-5;while(!x||ps.includes(x));ps.push(x)}sh(ps);materials.innerHTML='';ps.forEach((v,i)=>{let d=document.createElement('div');d.className='material';d.innerHTML=`<span class="material-label">資料${L[i]}</span>x²${lin(-2*v)}<br>＝${sq(v)} − ${v*v}`;materials.appendChild(d)})}function options(){let w=-p*p-c,a=[{p,q},{p:-p,q},{p,q:w},{p:-p,q:w}],seen=new Set;opts=[];for(let o of a)if(!seen.has(o.p+':'+o.q)){seen.add(o.p+':'+o.q);opts.push(o)}while(opts.length<4){let o={p:Math.random()<.5?p:-p,q:Math.floor(Math.random()*19)-9};if(!seen.has(o.p+':'+o.q)){seen.add(o.p+':'+o.q);opts.push(o)}}sh(opts);choices.innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="badge">${L[i]}</span>${ans(o.p,o.q).replace('²','<sup>2</sup>')}`;b.onclick=()=>judge(i);choices.appendChild(b)})}function newQ(){let k;do{do p=Math.floor(Math.random()*11)-5;while(!p);q=Math.floor(Math.random()*19)-9;c=p*p+q;k=p+':'+q}while(k===last);last=k;questionFormula.textContent='y = x²'+lin(-2*p)+sg(c);locked=false;hintLevel=0;hintBack.disabled=true;hintForward.disabled=false;hintForward.textContent='ヒントを見る（1/3）';hintBox.classList.add('hidden');hintBox.textContent='';feedback.textContent='';feedback.className='';next.classList.add('hidden');mat();options()}function steps(){return`資料より、x²${lin(-2*p)}＝${sq(p)} − ${p*p} です。<span class="calc">y＝${sq(p)} − ${p*p}${sg(c)}<br>＝${sq(p)}${sg(q)}</span>`}function renderHint(){if(hintLevel===0){hintBox.classList.add('hidden');hintBox.textContent='';hintBack.disabled=true;hintForward.disabled=false;hintForward.textContent='ヒントを見る（1/3）';return}hintBox.classList.remove('hidden');if(hintLevel===1)hintBox.innerHTML='ヒント1：資料と同じ式を見つけて代入してみよう！';else if(hintLevel===2)hintBox.innerHTML=`ヒント2：問題の「x²${lin(-2*p)}」と同じ左辺の資料を探そう。`;else hintBox.innerHTML=`ヒント3：使う資料は「x²${lin(-2*p)}＝${sq(p)} − ${p*p}」。このあと外側で −${p*p}${sg(c)} を計算しよう。`;hintBack.disabled=false;hintForward.disabled=hintLevel===3;hintForward.textContent=hintLevel<3?`次のヒントを見る（${hintLevel+1}/3）`:'ヒントはここまで'}hintForward.onclick=()=>{if(hintLevel>=3)return;hintLevel++;renderHint()};hintBack.onclick=()=>{if(hintLevel<=0)return;hintLevel--;renderHint()};function mistakeFeedback(o){const pRight=o.p===p,qRight=o.q===q,parts=[];if(pRight&&!qRight)parts.push('<b>おしい！カッコの中は合っています！</b>');if(!pRight&&qRight)parts.push('<b>おしい！外側の数は合っています！</b>');if(!pRight)parts.push(`資料より、x²${lin(-2*p)}＝${sq(p)} − ${p*p} なので、カッコの中は ${p>0?'x − '+p:'x + '+(-p)} です。`);if(!qRight)parts.push(`外側の数は、−${p*p}${sg(c)}＝${q} です。`);parts.push(steps());return parts.join('<br><br>')};function judge(i){if(locked)return;locked=true;stopClock();let o=opts[i],ok=o.p===p&&o.q===q,bs=[...document.querySelectorAll('.choice')],ci=opts.findIndex(v=>v.p===p&&v.q===q);bs[ci].classList.add('correct');if(!ok)bs[i].classList.add('wrong');if(ok)score++;by('score').textContent=score;rate.textContent=(score/n*100).toFixed(1);feedback.className=ok?'ok':'ng';feedback.innerHTML=ok?`<b>正解！</b><br>${steps()}<br>したがって、<b>${ans(p,q)}</b> です。`:`<b>不正解…</b><br>選んだ式は <b>${ans(o.p,o.q)}</b>、正しい式は <b>${ans(p,q)}</b> です。<br><br>${mistakeFeedback(o)}`;if(n===N){finish();requestAnimationFrame(()=>feedback.scrollIntoView({behavior:'smooth',block:'start'}))}else{next.classList.remove('hidden');requestAnimationFrame(()=>next.scrollIntoView({behavior:'smooth',block:'center'}))}}next.onclick=()=>{n++;qn.textContent=n;startClock();newQ();requestAnimationFrame(()=>materials.scrollIntoView({behavior:'smooth',block:'start'}))};function finish(){finished=true;clearInterval(timer);paused.classList.add('hidden');let sec=now()/1000,msg=score===5?'全問正解！平方完成はカンペキ！！':score===4?'おしい！あとひといき！':score>=2?'もっといける！資料と外側の計算を確認しよう！':score===1?'1つできたら全部できるハズ！':'まずは問題と同じ文字式の資料を探してみよう！';if(score===5&&sec<30)msg+='<br>速い！平方完成スピードマスター！';else if(score===5&&sec<45)msg+='<br>疾風の平方完成マスター！';const isBest=updateBest(score,sec);result.innerHTML=`<b>結果</b><br>5問中 ${score}問正解<br>正答率 ${(score/5*100).toFixed(1)}%<br>解答時間 ${sec.toFixed(1)}秒${isBest?'<br><b>★ 最高記録を更新！ ★</b>':''}<br><br><b>${msg}</b>`;result.classList.remove('hidden');retry.classList.remove('hidden')}function start(){n=1;score=0;finished=false;last='';qn.textContent=1;by('score').textContent=0;rate.textContent='0.0';result.classList.add('hidden');retry.classList.add('hidden');clearInterval(timer);elapsed=0;startClock();timer=setInterval(render,100);newQ();scrollTo({top:0})}retry.onclick=start;showBest();start()})();
</script></body></html>
