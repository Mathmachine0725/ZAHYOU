<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1次関数グラフチャレンジ Ver.6</title><style>
:root{--b:#2563eb;--g:#15803d;--r:#dc2626;--p:#7c3aed}*{box-sizing:border-box}body{margin:0;padding:10px;background:#eef3f8;font-family:Meiryo,sans-serif;text-align:center;color:#172033}main{max-width:760px;margin:auto;background:#fff;padding:14px;border-radius:18px;box-shadow:0 8px 28px #1720331c}h1{font-size:clamp(23px,5vw,35px);margin:4px}.problem{font-size:clamp(21px,5vw,30px);font-weight:bold;margin:8px}.formula{color:var(--b);font-size:1.22em}canvas{display:block;width:min(100%,600px);height:auto;margin:auto;border:2px solid #222;border-radius:8px;touch-action:none}.guide{margin:8px}.selected{max-width:640px;margin:8px auto;padding:9px;min-height:54px;background:#f7f9fc;border:1px solid #cbd5e1;border-radius:12px}.legend{font-size:14px;color:#64748b}#feedback{max-width:640px;min-height:95px;margin:10px auto;padding:11px;border-radius:12px;line-height:1.55}.ok{background:#ecfdf5;color:#166534;border:1px solid #86efac}.ng{background:#fff1f2;color:#9f1239;border:1px solid #fda4af}button{font-size:18px;color:#fff;background:var(--p);font-weight:bold;border:0;border-radius:9px;padding:10px 19px}.retry{background:var(--g)}.stats{margin:10px}.result{max-width:620px;margin:14px auto;padding:16px;background:#f0f9ff;border:2px solid #7dd3fc;border-radius:14px;font-size:20px;line-height:1.65}.hidden{display:none!important}.paused{color:var(--p);font-weight:bold}@media(max-width:560px){body{padding:5px}main{padding:8px}.guide,.stats{font-size:15px}#feedback{font-size:15px}}
</style></head><body><main><h1>1次関数グラフチャレンジ</h1><div class="problem">次の関数のグラフをかこう！<br><span id="formula" class="formula"></span></div><canvas id="graph" width="600" height="600"></canvas><div class="guide">点A、点Bの順に格子点をタップしよう。点Bを選ぶと自動判定します。</div><div id="selected" class="selected">1点目の点Aをタップしてください。</div><div class="legend">赤い線：選んだ直線 ／ 緑の点線：正しいグラフ</div><div id="feedback"></div><button id="next" class="hidden">次の問題へ</button><div class="stats">問題 <span id="qn">1</span>/5 ｜ 正解数 <span id="score">0</span> ｜ 正答率 <span id="rate">0.0</span>% ｜ 時間 <span id="time">0.0</span>秒 <span id="paused" class="paused hidden">（停止中）</span></div><div id="result" class="result hidden"></div><button id="retry" class="retry hidden">もう一度挑戦</button></main><script>
(()=>{'use strict';const cv=document.getElementById('graph'),x=cv.getContext('2d'),N=5,m=-9,M=9,S=600,c=300,pad=55,u=(S-pad*2)/18;let a=1,b=0,q=1,score=0,pts=[],locked=false,finished=false,showAns=false,elapsed=0,since=0,running=false,timer;const X=v=>c+v*u,Y=v=>c-v*u;function L(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}function arrow(a,b,c,d){L(a,b,c,d);let z=Math.atan2(d-b,c-a),l=11;L(c,d,c-l*Math.cos(z-.45),d-l*Math.sin(z-.45));L(c,d,c-l*Math.cos(z+.45),d-l*Math.sin(z+.45))}function base(){x.clearRect(0,0,S,S);x.fillStyle='#fff';x.fillRect(0,0,S,S);x.strokeStyle='#d6dbe3';x.lineWidth=1;for(let i=m;i<=M;i++){L(X(i),pad,X(i),S-pad);L(pad,Y(i),S-pad,Y(i))}x.strokeStyle='#111';x.lineWidth=2;arrow(pad,c,S-pad+14,c);arrow(c,S-pad,c,pad-14);x.fillStyle='#111';x.font='14px sans-serif';x.textAlign='center';x.textBaseline='top';for(let i=m;i<=M;i++)if(i)x.fillText(i,X(i),c+6);x.textAlign='left';x.textBaseline='middle';for(let i=m;i<=M;i++)if(i)x.fillText(i,c+7,Y(i));x.fillText('O',c+7,c+15);x.font='bold 18px sans-serif';x.fillText('X',S-pad+24,c-15);x.fillText('Y',c+13,pad-25)}function clip(A,B){let dx=B.x-A.x,dy=B.y-A.y,z=[];if(!dx)return[{x:A.x,y:m},{x:A.x,y:M}];z.push({x:m,y:A.y+(m-A.x)*dy/dx},{x:M,y:A.y+(M-A.x)*dy/dx});if(dy)z.push({x:A.x+(m-A.y)*dx/dy,y:m},{x:A.x+(M-A.y)*dx/dy,y:M});let r=[];for(const P of z)if(P.x>=m-1e-8&&P.x<=M+1e-8&&P.y>=m-1e-8&&P.y<=M+1e-8&&!r.some(Q=>Math.abs(Q.x-P.x)<1e-7&&Math.abs(Q.y-P.y)<1e-7))r.push(P);return r.length>1?[r[0],r[1]]:null}function inf(A,B,col,dash=[]){let e=clip(A,B);if(!e)return;x.save();x.strokeStyle=col;x.lineWidth=4;x.setLineDash(dash);L(X(e[0].x),Y(e[0].y),X(e[1].x),Y(e[1].y));x.restore()}function ok(){return pts.length===2&&pts.every(P=>P.y===a*P.x+b)}function draw(){base();if(showAns)inf({x:m,y:a*m+b},{x:M,y:a*M+b},'#16a34a',[10,6]);if(pts.length===2)inf(pts[0],pts[1],locked?(ok()?'#15803d':'#dc2626'):'#2563eb');pts.forEach((P,i)=>{x.fillStyle=i?'#7c3aed':'#2563eb';x.beginPath();x.arc(X(P.x),Y(P.y),7,0,Math.PI*2);x.fill();x.font='bold 16px sans-serif';x.fillText(i?'B':'A',X(P.x)+9,Y(P.y)-8)})}function f(){let s='y = ';s+=a===1?'x':a===-1?'−x':(a<0?'−'+-a:a)+'x';if(b>0)s+=' + '+b;else if(b<0)s+=' − '+-b;return s}function now(){return elapsed+(running?performance.now()-since:0)}function render(){time.textContent=(now()/1000).toFixed(1)}function startClock(){if(!running&&!finished){since=performance.now();running=true;paused.classList.add('hidden')}}function stopClock(){if(running){elapsed+=performance.now()-since;running=false;render();paused.classList.remove('hidden')}}function resetClock(){elapsed=0;since=performance.now();running=true;paused.classList.add('hidden')}function newQ(){do a=Math.floor(Math.random()*9)-4;while(!a);b=Math.floor(Math.random()*15)-7;formula.textContent=f();pts=[];locked=false;showAns=false;selected.textContent='1点目の点Aをタップしてください。';feedback.textContent='';feedback.className='';next.classList.add('hidden');draw()}function grid(e){let r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*S/r.width,py=(e.clientY-r.top)*S/r.height;if(px<pad-u/2||px>S-pad+u/2||py<pad-u/2||py>S-pad+u/2)return null;return{x:Math.max(m,Math.min(M,Math.round((px-c)/u))),y:Math.max(m,Math.min(M,Math.round((c-py)/u)))}}function explain(P){let v=a*P.x+b;return`${P.y===v?'○':'×'}（${P.x}，${P.y}）：y＝${a}×${P.x}${b>=0?'＋'+b:'−'+-b}＝${v}`}function judge(){locked=true;stopClock();if(ok())score++;else showAns=true;draw();feedback.className=ok()?'ok':'ng';feedback.innerHTML=ok()?`<b>正解！</b><br>A、Bはどちらも ${f()} の直線上にあります。`:`<b>不正解…</b><br>${explain(pts[0])}<br>${explain(pts[1])}<br><b>緑の点線が正しいグラフです。</b>`;document.getElementById('score').textContent=score;rate.textContent=(score/q*100).toFixed(1);selected.textContent=`A（${pts[0].x}，${pts[0].y}）、B（${pts[1].x}，${pts[1].y}）で判定しました。`;q===N?finish():next.classList.remove('hidden')}cv.addEventListener('pointerdown',e=>{if(locked||finished)return;let P=grid(e);if(!P)return;if(!pts.length){pts.push(P);selected.textContent=`A（${P.x}，${P.y}）を選択中。同じ点を再タップすると取り消せます。次に点Bをタップしてください。`;draw()}else{let A=pts[0];if(A.x===P.x&&A.y===P.y){pts=[];selected.textContent='点Aを取り消しました。1点目の点Aをタップしてください。';draw()}else{pts.push(P);draw();judge()}}});next.onclick=()=>{q++;qn.textContent=q;startClock();newQ()};function finish(){finished=true;clearInterval(timer);paused.classList.add('hidden');let sec=now()/1000,msg='';if(score===5)msg='全問正解！すごい！！';else if(score===4)msg='おしい！あとひといき！';else if(score>=2)msg='もっといける！';else if(score===1)msg='1つできたら全部できるハズ！';else msg='もう一度ルールを見直してみよう！';if(score===5&&sec<20)msg+='<br>はやい，はやすぎる……！君が1次関数スピードマスターだ……。';else if(score===5&&sec<30)msg+='<br>疾風迅雷の1次関数マスター！';result.innerHTML=`<b>結果</b><br>5問中 ${score}問正解<br>正答率 ${(score/5*100).toFixed(1)}%<br>解答時間 ${sec.toFixed(1)}秒<br><br><b>${msg}</b>`;result.classList.remove('hidden');retry.classList.remove('hidden')}function start(){q=1;score=0;finished=false;qn.textContent='1';document.getElementById('score').textContent='0';rate.textContent='0.0';result.classList.add('hidden');retry.classList.add('hidden');clearInterval(timer);resetClock();timer=setInterval(render,100);newQ()}retry.onclick=start;start()})();
</script></body></html>
