<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>座標タップチャレンジ</title>
<style>
:root{--blue:#2563eb;--green:#15803d;--red:#dc2626;--purple:#7c3aed;--ink:#172033}*{box-sizing:border-box}body{margin:0;padding:8px;background:#eef3f8;font-family:Meiryo,sans-serif;text-align:center;color:var(--ink)}main{max-width:760px;margin:auto;background:#fff;padding:12px;border-radius:18px;box-shadow:0 8px 28px #1720331c}h1{font-size:clamp(23px,5vw,35px);margin:4px}.problem{font-size:clamp(21px,5vw,30px);font-weight:bold;margin:8px}.target{color:var(--blue);font-size:1.25em}canvas{display:block;width:min(100%,600px);height:auto;margin:auto;border:2px solid #222;border-radius:8px;touch-action:none}.guide{margin:9px}.selected{max-width:640px;margin:8px auto;padding:9px;min-height:50px;background:#f7f9fc;border:1px solid #cbd5e1;border-radius:12px}#feedback{max-width:640px;min-height:76px;margin:10px auto;padding:11px;border-radius:12px;line-height:1.55}.ok{background:#ecfdf5;color:#166534;border:1px solid #86efac}.ng{background:#fff1f2;color:#9f1239;border:1px solid #fda4af}button{font-size:18px;color:#fff;background:var(--purple);font-weight:bold;border:0;border-radius:9px;padding:10px 19px;margin:8px 4px 2px}.retry{background:var(--green)}.stats{margin:10px}.paused{color:var(--purple);font-weight:bold}.result{max-width:620px;margin:14px auto;padding:16px;background:#f0f9ff;border:2px solid #7dd3fc;border-radius:14px;font-size:20px;line-height:1.65}.hidden{display:none!important}@media(max-width:560px){body{padding:4px}main{padding:7px}.guide,.stats{font-size:15px}#feedback{font-size:15px}}
</style></head><body><main>
<h1>座標タップチャレンジ</h1>
<div class="problem">次の座標をタップしよう！<br><span id="target" class="target"></span></div>
<canvas id="graph" width="600" height="600" aria-label="マイナス6から6までの座標平面"></canvas>
<button id="next" class="hidden" type="button">次の問題へ</button>
<div id="feedback" aria-live="polite"></div>
<div class="stats">問題 <span id="qn">1</span>/5 ｜ 正解数 <span id="score">0</span> ｜ 正答率 <span id="rate">0.0</span>% ｜ 時間 <span id="time">0.0</span>秒 <span id="paused" class="paused hidden">（停止中）</span></div>
<div class="guide">表示された座標に対応する格子点をタップしよう。</div>
<div id="selected" class="selected">格子点を1つタップしてください。</div>
<div id="result" class="result hidden"></div><button id="retry" class="retry hidden" type="button">もう一度挑戦</button>
</main><script>
(()=>{'use strict';const cv=document.getElementById('graph'),ctx=cv.getContext('2d');const N=5,min=-6,max=6,S=600,c=300,pad=54,u=(S-pad*2)/12;let ax=0,ay=0,q=1,score=0,chosen=null,locked=false,finished=false,elapsed=0,since=0,running=false,timer;const X=v=>c+v*u,Y=v=>c-v*u;function L(a,b,d,e){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(d,e);ctx.stroke()}function arrow(a,b,d,e){L(a,b,d,e);const z=Math.atan2(e-b,d-a),l=12;L(d,e,d-l*Math.cos(z-.45),e-l*Math.sin(z-.45));L(d,e,d-l*Math.cos(z+.45),e-l*Math.sin(z+.45))}function base(){ctx.clearRect(0,0,S,S);ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1.3;for(let i=min;i<=max;i++){L(X(i),pad,X(i),S-pad);L(pad,Y(i),S-pad,Y(i))}ctx.strokeStyle='#111827';ctx.lineWidth=2.5;arrow(pad,c,S-pad+15,c);arrow(c,S-pad,c,pad-15);ctx.fillStyle='#111827';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';for(let i=min;i<=max;i++)if(i)ctx.fillText(i,X(i),c+7);ctx.textAlign='left';ctx.textBaseline='middle';for(let i=min;i<=max;i++)if(i)ctx.fillText(i,c+8,Y(i));ctx.fillText('O',c+8,c+17);ctx.font='bold 19px sans-serif';ctx.fillText('X',S-pad+25,c-16);ctx.fillText('Y',c+14,pad-26)}function point(x,y,color,label){ctx.fillStyle=color;ctx.beginPath();ctx.arc(X(x),Y(y),9,0,Math.PI*2);ctx.fill();ctx.font='bold 17px sans-serif';ctx.fillText(label,X(x)+12,Y(y)-12)}function draw(){base();if(chosen)point(chosen.x,chosen.y,chosen.x===ax&&chosen.y===ay?'#15803d':'#dc2626','P');if(locked&&chosen&&(chosen.x!==ax||chosen.y!==ay))point(ax,ay,'#15803d','正解')}function now(){return elapsed+(running?performance.now()-since:0)}function render(){time.textContent=(now()/1000).toFixed(1)}function startClock(){if(!running&&!finished){since=performance.now();running=true;paused.classList.add('hidden')}}function stopClock(){if(running){elapsed+=performance.now()-since;running=false;render();paused.classList.remove('hidden')}}function resetClock(){elapsed=0;since=performance.now();running=true;paused.classList.add('hidden')}function newQ(){ax=Math.floor(Math.random()*13)-6;ay=Math.floor(Math.random()*13)-6;target.textContent=`P（${ax}，${ay}）`;chosen=null;locked=false;selected.textContent='格子点を1つタップしてください。';feedback.textContent='';feedback.className='';next.classList.add('hidden');draw()}function grid(e){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*S/r.width,py=(e.clientY-r.top)*S/r.height;if(px<pad-u/2||px>S-pad+u/2||py<pad-u/2||py>S-pad+u/2)return null;return{x:Math.max(min,Math.min(max,Math.round((px-c)/u))),y:Math.max(min,Math.min(max,Math.round((c-py)/u)))}}function judge(P){locked=true;chosen=P;stopClock();const ok=P.x===ax&&P.y===ay;if(ok)score++;draw();feedback.className=ok?'ok':'ng';feedback.innerHTML=ok?`<b>正解！</b><br>P（${ax}，${ay}）を正しく選べました。`:`<b>不正解…</b><br>タップした点は（${P.x}，${P.y}）です。<br>正しい位置を緑色で表示しました。`;selected.textContent=`選んだ点：P（${P.x}，${P.y}）`;document.getElementById('score').textContent=score;rate.textContent=(score/q*100).toFixed(1);q===N?finish():next.classList.remove('hidden')}cv.addEventListener('pointerdown',e=>{if(locked||finished)return;const P=grid(e);if(P)judge(P)});next.onclick=()=>{q++;qn.textContent=q;startClock();newQ()};function finish(){finished=true;clearInterval(timer);paused.classList.add('hidden');const sec=now()/1000;let msg='';if(score===5)msg='全問正解！すごい！！';else if(score===4)msg='おしい！あとひといき！';else if(score>=2)msg='もっといける！';else if(score===1)msg='1つできたら全部できるハズ！';else msg='もう一度ルールを見直してみよう！';if(score===5&&sec<20)msg+='<br>はやい，はやすぎる……！君が座標スピードマスターだ……。';else if(score===5&&sec<30)msg+='<br>疾風迅雷の座標マスター！';result.innerHTML=`<b>結果</b><br>5問中 ${score}問正解<br>正答率 ${(score/5*100).toFixed(1)}%<br>解答時間 ${sec.toFixed(1)}秒<br><br><b>${msg}</b>`;result.classList.remove('hidden');retry.classList.remove('hidden')}function start(){q=1;score=0;finished=false;qn.textContent='1';document.getElementById('score').textContent='0';rate.textContent='0.0';result.classList.add('hidden');retry.classList.add('hidden');clearInterval(timer);resetClock();timer=setInterval(render,100);newQ()}retry.onclick=start;start()})();
</script></body></html>
