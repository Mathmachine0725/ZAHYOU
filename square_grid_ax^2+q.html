<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>y=ax²+q 放物線の上下移動 Ver.6</title><style>
:root{--b:#2563eb;--g:#15803d;--r:#dc2626;--p:#7c3aed}*{box-sizing:border-box}body{margin:0;padding:6px;background:#eef3f8;font-family:Meiryo,sans-serif;text-align:center;color:#172033}main{max-width:850px;margin:auto;background:#fff;padding:12px;border-radius:18px}h1{font-size:clamp(22px,5vw,35px);margin:4px}.problem{font-size:clamp(20px,5vw,29px);font-weight:bold;margin:8px}.formula{color:var(--b);font-size:1.25em}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px;margin:10px auto}.choice{position:relative;border:3px solid #cbd5e1;border-radius:13px;background:white;padding:7px}.choice canvas{display:block;width:100%;height:auto;border:1px solid #94a3b8;border-radius:7px}.choice.correct{border-color:var(--g);background:#ecfdf5}.choice.wrong{border-color:var(--r);background:#fff1f2}.badge{position:absolute;left:7px;top:7px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#172033;color:white;font-weight:bold}.hidden{display:none!important}#next,#retry{font-size:18px;color:white;background:var(--p);font-weight:bold;border:0;border-radius:9px;padding:10px 20px;margin:8px}#retry{background:var(--g)}#feedback{max-width:720px;min-height:100px;margin:10px auto;padding:12px;border-radius:12px;line-height:1.6}.ok{background:#ecfdf5;color:#166534;border:1px solid #86efac}.ng{background:#fff1f2;color:#9f1239;border:1px solid #fda4af}.stats{margin:10px}.paused{color:var(--p);font-weight:bold}.result{max-width:680px;margin:14px auto;padding:16px;background:#f0f9ff;border:2px solid #7dd3fc;border-radius:14px;font-size:20px;line-height:1.65}.guide{font-size:14px;color:#64748b}@media(max-width:540px){main{padding:7px}.choices{gap:6px}.choice{padding:4px;border-width:2px}.badge{width:25px;height:25px;font-size:14px;left:4px;top:4px}.stats,#feedback{font-size:14px}}
</style></head><body><main><h1>y=ax²+q 放物線の上下移動</h1><div class="problem">次の関数のグラフはどれ？<br><span id="formula" class="formula"></span></div><div id="choices" class="choices"></div><button id="next" class="hidden">次の問題へ</button><div id="feedback"></div><div class="stats">問題 <span id="qn">1</span>/5 ｜ 正解数 <span id="score">0</span> ｜ 正答率 <span id="rate">0.0</span>% ｜ 時間 <span id="time">0.0</span>秒 <span id="paused" class="paused hidden">（停止中）</span></div><div class="guide">A〜Dのグラフをタップして答えよう。方眼は縦横同じ大きさです。</div><div id="result" class="result hidden"></div><button id="retry" class="hidden">もう一度挑戦</button></main><script>
(()=>{'use strict';const total=5,min=-6,max=6,W=320,H=320,pad=30,letters=['A','B','C','D'];let ta=1,tq=1,n=1,score=0,locked=false,finished=false,opts=[],elapsed=0,since=0,running=false,timer;function formula(a,q){let s='y = '+(a===1?'x²':a===-1?'−x²':(a<0?'−'+(-a):a)+'x²');if(q>0)s+=' + '+q;else if(q<0)s+=' − '+(-q);return s}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function line(c,a,b,d,e){c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke()}function graph(cv,a,q){let c=cv.getContext('2d'),p=W-pad*2,X=x=>pad+(x-min)/(max-min)*p,Y=y=>pad+(max-y)/(max-min)*p;c.clearRect(0,0,W,H);c.fillStyle='white';c.fillRect(0,0,W,H);c.strokeStyle='#e2e8f0';for(let i=min;i<=max;i++){line(c,X(i),pad,X(i),H-pad);line(c,pad,Y(i),W-pad,Y(i))}c.strokeStyle='#1f2937';c.lineWidth=1.7;line(c,pad,Y(0),W-pad,Y(0));line(c,X(0),H-pad,X(0),pad);c.fillStyle='#1f2937';c.font='10px sans-serif';c.textAlign='center';for(let i=min;i<=max;i+=2)if(i)c.fillText(i,X(i),Y(0)+12);c.textAlign='left';for(let i=min;i<=max;i+=2)if(i)c.fillText(i,X(0)+4,Y(i)+3);c.strokeStyle='#2563eb';c.lineWidth=3;c.beginPath();let on=false;for(let px=0;px<=p;px++){let x=min+px/p*(max-min),y=a*x*x+q;if(y<min-.2||y>max+.2){on=false;continue}if(!on){c.moveTo(X(x),Y(y));on=true}else c.lineTo(X(x),Y(y))}c.stroke()}function now(){return elapsed+(running?performance.now()-since:0)}function render(){time.textContent=(now()/1000).toFixed(1)}function startClock(){since=performance.now();running=true;paused.classList.add('hidden')}function stopClock(){if(running){elapsed+=performance.now()-since;running=false;render();paused.classList.remove('hidden')}}function resetClock(){elapsed=0;startClock();render()}function make(){let aa=1+Math.floor(Math.random()*3),qq=1+Math.floor(Math.random()*3);ta=Math.random()<.5?aa:-aa;tq=Math.random()<.5?qq:-qq;document.getElementById('formula').textContent=formula(ta,tq);opts=shuffle([{a:aa,q:qq},{a:-aa,q:qq},{a:aa,q:-qq},{a:-aa,q:-qq}]);locked=false;feedback.textContent='';feedback.className='';next.classList.add('hidden');choices.innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="badge">${letters[i]}</span><canvas width="${W}" height="${H}"></canvas>`;b.onclick=()=>judge(i);choices.appendChild(b);graph(b.querySelector('canvas'),o.a,o.q)})}function help(o){let ar=Math.sign(o.a)===Math.sign(ta),qr=Math.sign(o.q)===Math.sign(tq),parts=[];if(!ar&&qr)parts.push(`<b>おしい！定数 q は合っています！</b><br><b>x²の係数 a</b> のプラス・マイナスが逆になっています。<br>aはグラフの開く向きと細さを表します。a＝${ta} なので、正しいグラフは${ta>0?'下に凸です':'上に凸です'}。また、aの数字が大きいほど細い形になります。`);else if(ar&&!qr)parts.push(`<b>おしい！x²の係数 a は合っています！</b><br><b>定数 q</b> のプラス・マイナスが逆になっています。<br>qはグラフが上下にどれだけ動くかを表します。q＝${tq} なので、頂点は（0，${tq}）です。`);else if(!ar&&!qr){parts.push(`<b>x²の係数 a</b> のプラス・マイナスが逆になっています。<br>aはグラフの開く向きと細さを表します。a＝${ta} なので、正しいグラフは${ta>0?'下に凸です':'上に凸です'}。また、aの数字が大きいほど細い形になります。`);parts.push(`<b>定数 q</b> のプラス・マイナスが逆になっています。<br>qはグラフが上下にどれだけ動くかを表します。q＝${tq} なので、頂点は（0，${tq}）です。`)}return parts.join('<br><br>')}function judge(i){if(locked)return;locked=true;stopClock();let o=opts[i],ok=o.a===ta&&o.q===tq,bs=[...document.querySelectorAll('.choice')],ci=opts.findIndex(z=>z.a===ta&&z.q===tq);bs[ci].classList.add('correct');if(!ok)bs[i].classList.add('wrong');if(ok)score++;document.getElementById('score').textContent=score;rate.textContent=(score/n*100).toFixed(1);feedback.className=ok?'ok':'ng';feedback.innerHTML=ok?`<b>正解！</b><br>a＝${ta} だから${ta>0?'下に凸です':'上に凸です'}。<br>q＝${tq} だから、頂点は（0，${tq}）です。`:`<b>不正解…</b><br>選んだグラフは <b>${formula(o.a,o.q)}</b>、出題のグラフは <b>${formula(ta,tq)}</b> です。<br><br>${help(o)}`;n===total?finish():next.classList.remove('hidden')}next.onclick=()=>{n++;qn.textContent=n;startClock();make();scrollTo({top:0,behavior:'smooth'})};function finish(){finished=true;clearInterval(timer);paused.classList.add('hidden');let sec=now()/1000,msg=score===5?'全問正解！aとqの働きを完全に見抜いた！':score===4?'おしい！あとひといき！':score>=2?'もっといける！開く向きと、頂点を確認しよう！':score===1?'1つできたら全部できるハズ！':'まずはaのプラス・マイナスと、頂点（0，q）を確認しよう！';if(score===5&&sec<20)msg+='<br>はやい，はやすぎる……！君が放物線スピードマスターだ……。';else if(score===5&&sec<30)msg+='<br>疾風迅雷の放物線マスター！';result.innerHTML=`<b>結果</b><br>5問中 ${score}問正解<br>正答率 ${(score/5*100).toFixed(1)}%<br>解答時間 ${sec.toFixed(1)}秒<br><br><b>${msg}</b>`;result.classList.remove('hidden');retry.classList.remove('hidden')}function start(){n=1;score=0;finished=false;qn.textContent=1;document.getElementById('score').textContent=0;rate.textContent='0.0';result.classList.add('hidden');retry.classList.add('hidden');clearInterval(timer);resetClock();timer=setInterval(render,100);make();scrollTo({top:0})}retry.onclick=start;start()})();
</script></body></html>
